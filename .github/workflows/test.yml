name: test
# Manual runs only (Actions tab > test > Run workflow); only people with write
# access to this repository can start one, and the job runs only for the owner
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/togoder-scan.js --help
